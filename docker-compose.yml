volumes:
  n8n_storage:

networks:
  app_network:
    driver: bridge
  

services:

  postgres:
    restart: always
    image: postgres:16.4-alpine
    container_name: postgres
    ports:
      - "5434:5432"
    volumes:
      - ${POSTGRES_HOST_DIR}:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - app_network
  n8n:
    image: n8nio/n8n:latest
    restart: always
    ports:
      - "5678:5678"
    volumes:
      - n8n_storage:/home/node/.n8n
      - C:/Users/evalu/Desktop/JOHNNY/n8ntest:/data/scripts
    environment:
    - N8N_CORS_ALLOWED_ORIGINS=http://localhost:3000
    - NODE_FUNCTION_ALLOW_EXTERNAL=pdf-parse
    - NODE_FUNCTION_ALLOW_BUILTIN=*
    networks:
      - app_network


  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: craw4ai
    restart: always
    ports:
      - "11235:11235"
    environment:
      - HOST=0.0.0.0
      - PORT=11235
    volumes:
      - C:/Users/evalu/Desktop/JOHNNY/n8ntest:/data/scripts
    networks:
      - app_network


  react:
    build: C:/Users/evalu/Desktop/JOHNNY/n8ntest/React
    container_name: react
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - C:/Users/evalu/Desktop/JOHNNY/n8ntest/React/src:/app/src
      - C:/Users/evalu/Desktop/JOHNNY/n8ntest/React/public:/app/public
    environment:
      - REACT_APP_N8N_URL=http://n8n:5678
      # 本機開發用：直接讀 dev_api.py（在本機另外用 python -m subsidy_crawler.dev_api 啟動），
      # 跳過加密靜態檔+密碼那一套。只影響這個 docker-compose 的 npm start，deploy_palantir
      # 是在本機另外執行 npm run build、不吃這個環境變數，不會被誤打包進正式發布版本。
      # 注意：這個網址是「瀏覽器」要拿去 fetch 的（REACT_APP_* 會被打包進JS bundle、
      # 在瀏覽器裡執行），瀏覽器永遠跑在本機（host），不是在 container 網路裡，
      # 所以用 localhost，不是 host.docker.internal（那個是給 container 內部連回host用的）。
      - REACT_APP_LOCAL_API_URL=http://localhost:8001/api/subsidies
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=0
    networks:
      - app_network
    depends_on:
      - n8n



     
